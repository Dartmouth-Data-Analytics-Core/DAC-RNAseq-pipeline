name: pca_plotnine_env
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - scikit-learn
  - scipy
  # -base variants: no Qt/PySide GUI stack (~150 MB) that a headless PNG writer never uses
  - matplotlib-base
  - numpy
  - seaborn-base
  - plotnine
  - pandas
  - fastcluster
  - r-base
  - bioconductor-deseq2
